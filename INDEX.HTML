<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>WENEVERGONNACLOSE — +U Overflow</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    :root {
      --bg: #000000;
      --fg: #ffffff;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background: var(--bg);
      color: var(--fg);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .page {
      max-width: 720px;
      padding: 32px;
      text-align: center;
    }
    h1 {
      font-size: 1.8rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-bottom: 8px;
    }
    h2 {
      font-size: 1rem;
      font-weight: 400;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      margin-bottom: 24px;
    }
    .symbol-wrap {
      margin: 32px auto 24px;
      width: 220px;
      height: 260px;
      position: relative;
    }
    .stick-figure {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
    }
    .head {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: 3px solid var(--fg);
      margin-top: 8px;
    }
    .body {
      width: 3px;
      height: 80px;
      background: var(--fg);
      margin-top: 6px;
    }
    .arms {
      display: flex;
      justify-content: space-between;
      width: 120px;
      margin-top: 8px;
    }
    .arm {
      width: 3px;
      height: 40px;
      background: var(--fg);
      transform-origin: top;
    }
    .arm.left {
      transform: rotate(20deg);
    }
    .arm.right {
      transform: rotate(-20deg);
    }
    .legs {
      display: flex;
      justify-content: space-between;
      width: 80px;
      margin-top: 10px;
    }
    .leg {
      width: 3px;
      height: 50px;
      background: var(--fg);
      transform-origin: top;
    }
    .leg.left {
      transform: rotate(10deg);
    }
    .leg.right {
      transform: rotate(-10deg);
    }
    .cauldron {
      position: absolute;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 140px;
      height: 80px;
      border-radius: 0 0 70px 70px;
      background: var(--fg);
    }
    .cauldron-inner {
      position: absolute;
      inset: 8px 10px 10px;
      border-radius: 0 0 60px 60px;
      background: var(--bg);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .plus {
      font-size: 2.4rem;
      font-weight: 700;
      color: var(--fg);
    }
    .handle {
      position: absolute;
      top: -14px;
      width: 26px;
      height: 26px;
      border-radius: 50%;
      border: 3px solid var(--fg);
      background: var(--bg);
    }
    .handle.left {
      left: -18px;
    }
    .handle.right {
      right: -18px;
    }
    .ghost-hands {
      position: absolute;
      top: -26px;
      left: 50%;
      transform: translateX(-50%);
      width: 160px;
      display: flex;
      justify-content: space-between;
      opacity: 0.25;
    }
    .ghost-hand {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      border: 3px solid var(--fg);
    }
    .tagline {
      margin-top: 24px;
      font-size: 0.95rem;
      line-height: 1.5;
    }
    .routes {
      margin-top: 28px;
      font-size: 0.9rem;
      line-height: 1.6;
    }
    .routes a {
      color: var(--fg);
      text-decoration: underline;
    }
    .footer {
      margin-top: 32px;
      font-size: 0.75rem;
      opacity: 0.7;
    }
  </style>
</head>
<body>
  <main class="page">
    <h1>WENEVERGONNACLOSE.COM</h1>
    <h2>+U — ALL WAYS, ALWAYS</h2>

    <section class="symbol-wrap" aria-label="+U Overflow Symbol">
      <div class="stick-figure">
        <div class="head"></div>
        <div class="body"></div>
        <div class="arms">
          <div class="arm left"></div>
          <div class="arm right"></div>
        </div>
        <div class="legs">
          <div class="leg left"></div>
          <div class="leg right"></div>
        </div>
      </div>

      <div class="cauldron">
        <div class="ghost-hands">
          <div class="ghost-hand"></div>
          <div class="ghost-hand"></div>
        </div>
        <div class="handle left"></div>
        <div class="handle right"></div>
        <div class="cauldron-inner">
          <div class="plus">+</div>
        </div>
      </div>
    </section>

    <p class="tagline">
      Hold what you can. Share what overflows.  
      Made by you; for all.
    </p>

    <div class="routes">
      <p>Support routes:</p>
      <p>Cash App: <strong>$WHOLEDONUTS</strong></p>
      <p>Chime: <strong>WHOLEDONUTS</strong></p>
      <p>Primary hub: <a href="https://wholedonuts.cloud" target="_blank" rel="noopener">WHOLEDONUTS.CLOUD</a></p>
    </div>

    <div class="footer">
      +U Symbol Protocol · Whole Donuts LLC · Identity locked, black &amp; white, no redesign.
    </div>
  </main>
</body>
</html>
